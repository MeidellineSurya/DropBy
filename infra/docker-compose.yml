services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dropby
      POSTGRES_PASSWORD: dropby
      POSTGRES_DB: dropby
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropby"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../apps/api
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://dropby:dropby@postgres:5432/dropby
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - ../packages/ws-contracts:/packages/ws-contracts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ../apps/api
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://dropby:dropby@postgres:5432/dropby
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../apps/api:/app
      - ../packages/ws-contracts:/packages/ws-contracts
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: ../apps/api
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - ../apps/api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://dropby:dropby@postgres:5432/dropby
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../apps/api:/app
      - ../packages/ws-contracts:/packages/ws-contracts
    depends_on:
      - postgres
      - redis

  dashboard:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../apps/dashboard:/app
    ports:
      - "5173:5173"

volumes:
  postgres_data:
