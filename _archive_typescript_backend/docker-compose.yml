services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: dropby
      POSTGRES_USER: dropby
      POSTGRES_PASSWORD: dropby
    ports:
      - "5432:5432"
    volumes:
      - dropby_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropby -d dropby"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dropby_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/src/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://dropby:dropby@postgres:5432/dropby
      JWT_SECRET: local-docker-secret-change-before-deployment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://dropby:dropby@postgres:5432/dropby
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-docker-secret-change-before-deployment
      JWT_EXPIRES_IN: 15m
      CORS_ORIGIN: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  dropby_postgres:
  dropby_redis:
