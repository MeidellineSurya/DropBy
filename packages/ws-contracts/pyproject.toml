[project]
name = "ws-contracts"
version = "0.1.0"
description = "Frozen WebSocket event and shared DTO contracts for DropBy, imported by the API."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ws_contracts*"]
